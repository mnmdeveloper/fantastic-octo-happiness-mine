name: Build CutVPN

on:
  workflow_dispatch:
  push:
    paths:
      - 'ui/**'
      - 'installer/**'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish CutVPN UI
        run: dotnet publish ui/CutVPN.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Publish CutVPN full-screen setup
        run: dotnet publish installer/CutVPN.Setup.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload CutVPN UI
        uses: actions/upload-artifact@v4
        with:
          name: CutVPN-win-x64
          path: ui/bin/Release/net8.0-windows/win-x64/publish/

      - name: Upload full-screen CutVPN Setup
        uses: actions/upload-artifact@v4
        with:
          name: CutVPN-Setup
          path: installer/bin/Release/net8.0-windows/win-x64/publish/
